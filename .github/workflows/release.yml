name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.3"
          method: network

      - name: Install FFmpeg
        run: |
          choco install ffmpeg-shared -y
          $ffmpegPath = (Get-ChildItem -Path "C:\ProgramData\chocolatey\lib\ffmpeg-shared\tools\ffmpeg-*-shared" -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_DIR=$ffmpegPath" >> $env:GITHUB_ENV

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DFFMPEG_DIR="${{ env.FFMPEG_DIR }}"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package Windows release
        run: |
          mkdir release
          cp build/Release/nvdec_scene_detect.exe release/
          # Copy FFmpeg DLLs
          cp "${{ env.FFMPEG_DIR }}/bin/*.dll" release/
          Compress-Archive -Path release/* -DestinationPath nvdec_scene_detect-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: nvdec_scene_detect-windows-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: "12.6.3"
          method: network

      - name: Install FFmpeg development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DFFMPEG_DIR="/usr"

      - name: Build
        run: cmake --build build --config Release -j

      - name: Package Linux release
        run: |
          mkdir release
          cp build/nvdec_scene_detect release/
          chmod +x release/nvdec_scene_detect
          cd release && zip ../nvdec_scene_detect-linux-x64.zip nvdec_scene_detect

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: nvdec_scene_detect-linux-x64.zip

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nvdec_scene_detect-windows-x64.zip
            nvdec_scene_detect-linux-x64.zip
